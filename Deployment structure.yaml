apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: color-api
  template:
    metadata:
      labels:
        app: color-api
    spec:
      containers:
        - name: color-api
          image: color-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
